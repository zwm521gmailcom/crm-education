<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 教培 CRM</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      background: linear-gradient(135deg, #1f2937 0%, #4f46e5 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .login-card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .login-brand {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .login-sub {
      text-align: center;
      color: var(--gray-500);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .login-form .form-field { margin-bottom: 14px; }
    .login-form input {
      padding: 10px 12px;
      font-size: 14px;
    }
    .login-form button {
      width: 100%;
      padding: 11px;
      font-size: 14px;
      margin-top: 4px;
    }
    .login-hint {
      background: var(--primary-bg);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      color: #3730a3;
      margin-top: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-brand">📚 教培 CRM</div>
    <div class="login-sub">请登录后使用</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="flash flash-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" class="login-form">
      <div class="form-field">
        <label>用户名</label>
        <input type="text" name="username" required autofocus value="{{ request.form.get('username', '') }}">
      </div>
      <div class="form-field">
        <label>密码</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary">登 录</button>
    </form>

    <div class="login-hint">
      💡 默认账号: <strong>admin</strong> / 密码: <strong>admin123</strong><br>
      首次登录后建议在 <code>config.py</code> 改 SECRET_KEY 并修改密码。
    </div>
  </div>
</body>
</html>
